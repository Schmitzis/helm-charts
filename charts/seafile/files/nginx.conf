# Keep the scheme the upstream proxy (e.g. Envoy) saw; fall back to our own.
map $http_x_forwarded_proto $seafdav_forwarded_proto {
	default	$http_x_forwarded_proto;
	""	$scheme;
}

server {
	listen			80;
	server_name		_;

	access_log		off;
	error_log		stderr;

	# Relative Location headers for redirects nginx generates itself: behind a
	# TLS-terminating proxy this listener only sees http, so an absolute
	# redirect would send clients (and WebDAV credentials) to http://.
	absolute_redirect	off;

	location / {
		proxy_pass          http://${SEAHUB_SERVER_HOST}:8000;
		proxy_redirect      off;
		proxy_set_header    Host $http_host;
		proxy_set_header    X-Real-IP $remote_addr;
		proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header    X-Forwarded-Host $server_name;
	}

	location /seafhttp {
		rewrite ^/seafhttp(.*)$ $1 break;
		proxy_pass http://${SEAFILE_SERVER_HOST}:8082;
		client_max_body_size 0;
	}

	# SeafDAV runs with share_name = /seafdav/ (my_init.d/66-update-config.sh),
	# so the prefix must be kept, as in the Seafile 13 manual
	# (extension/webdav). X-Forwarded-Proto must say https when TLS ends
	# upstream, otherwise MOVE/rename fail with 502.
	location = /seafdav {
		return 301 /seafdav/;
	}

	location /seafdav/ {
		proxy_pass              http://${WEBDAV_SERVER_HOST}:8080/seafdav/;
		proxy_set_header        Host $http_host;
		proxy_set_header        X-Real-IP $remote_addr;
		proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header        X-Forwarded-Host $http_host;
		proxy_set_header        X-Forwarded-Proto $seafdav_forwarded_proto;
		proxy_read_timeout      1200s;
		client_max_body_size    0;
		# Stream uploads to SeafDAV instead of spooling them to the pod's disk.
		proxy_request_buffering off;
	}

	location /notification/ping {
		proxy_pass http://${NOTIFICATION_SERVER_HOST}:8083/ping;
	}

	location /notification {
		proxy_pass http://${NOTIFICATION_SERVER_HOST}:8083/;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}

	location /sdoc-server/ {
		rewrite ^/sdoc-server/(.*)$ /$1 break;
		proxy_pass http://${SEADOC_SERVER_HOST}:80;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		client_max_body_size 100m;
	}

	location /socket.io/ {
		proxy_pass http://${SEADOC_SERVER_HOST}:80;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}
}
