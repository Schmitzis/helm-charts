---
apiVersion: v1
kind: Service

metadata:
  name: {{ template "seafile.resname" . }}
  labels: {{ include "seafile.labels" . | indent 4 }}
    component: seafile

spec:

  selector: {{ include "seafile.labels-selector" . | indent 4 }}
    component: seafile

  ports:
  - port: 80
    # The nginx sidecar listens on 8081; 80 is reserved for the optional
    # sdoc-server sidecar in the shared pod network namespace.
    targetPort: 8081
